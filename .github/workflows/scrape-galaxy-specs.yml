name: Scrape Galaxy specifications

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-playwright.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run scraper
        run: python scraper/scrape_samsung_specs.py --browser --split --delay 1.5

      - name: Generate simple HTML index
        run: |
          python - <<'PY'
          from pathlib import Path

          output = Path("output")
          files = sorted(output.glob("*.txt"))

          rows = "".join(
              f'<li><a href="{file.name}">{file.stem.replace("-", " ").title()}</a></li>'
              for file in files
          )

          html = f"""<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Samsung Galaxy Specifications</title>
            <style>
              body {{ font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 20px; }}
              li {{ margin: 8px 0; }}
            </style>
          </head>
          <body>
            <h1>Samsung Galaxy Specifications</h1>
            <p>Machine-readable TXT specifications generated from Samsung Mobile Press for Chatbase ingestion.</p>
            <ul>{rows}</ul>
          </body>
          </html>"""

          (output / "index.html").write_text(html, encoding="utf-8")
          PY

      - name: Commit generated specifications
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/*.txt output/index.html
          git diff --cached --quiet || git commit -m "Update Galaxy specifications"
          git push
